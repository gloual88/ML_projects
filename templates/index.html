<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 ETF 투자 대시보드</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- 사이드바 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>⚙️ 대시보드 설정</h2>
            </div>

            <!-- 분석 대상 선택 -->
            <div class="settings-section">
                <h3>분석 대상 선택</h3>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="analysis-type" value="sector" checked>
                        <span>섹터 분석</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="analysis-type" value="theme">
                        <span>테마 분석</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="analysis-type" value="broad">
                        <span>광범위 지수</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="analysis-type" value="custom">
                        <span>커스텀 선택</span>
                    </label>
                </div>
            </div>

            <!-- 커스텀 선택 -->
            <div class="settings-section" id="custom-section" style="display: none;">
                <h3>ETF 선택</h3>
                <input type="text" id="search-etf" placeholder="ETF 검색...">
                <div id="etf-checkbox-list" class="etf-list"></div>
            </div>

            <!-- 기간 선택 -->
            <div class="settings-section">
                <h3>조회 기간</h3>
                <select id="period-select" class="select-control">
                    <option value="30">1개월</option>
                    <option value="90">3개월</option>
                    <option value="180">6개월</option>
                    <option value="365" selected>1년</option>
                    <option value="730">2년</option>
                    <option value="1825">5년</option>
                </select>
            </div>

            <!-- 새로고침 버튼 -->
            <div class="settings-section">
                <button id="refresh-btn" class="btn-primary">🔄 데이터 새로고침</button>
            </div>

            <!-- 정보 -->
            <div class="sidebar-footer">
                <p>💡 본 대시보드는 교육 목적입니다.</p>
                <p>투자 결정 전 전문가 상담을 받으세요.</p>
            </div>
        </aside>

        <!-- 메인 콘텐츠 -->
        <main class="main-content">
            <!-- 헤더 -->
            <header class="header">
                <h1>📊 ETF 투자 대시보드</h1>
                <div class="header-info">
                    <span>마지막 업데이트: <strong id="update-time">--:--:--</strong></span>
                    <span>데이터 소스: Yahoo Finance</span>
                </div>
            </header>

            <!-- 실시간 성과 현황 -->
            <section class="section">
                <h2>📍 실시간 ETF 성과 현황</h2>
                <div class="loading-spinner" id="performance-loading">로딩 중...</div>
                <div id="performance-cards" class="performance-cards-grid"></div>
            </section>

            <!-- 가격 추이 -->
            <section class="section">
                <h2>📈 ETF 가격 추이</h2>
                <div class="loading-spinner" id="price-loading">로딩 중...</div>
                <div id="price-chart" class="chart-container"></div>
            </section>

            <!-- YTD 성과 비교 -->
            <section class="section">
                <h2>📊 연초 이후 성과 비교 (YTD)</h2>
                <div class="loading-spinner" id="ytd-loading">로딩 중...</div>
                <div id="ytd-chart" class="chart-container"></div>
            </section>

            <!-- 기술적 분석 -->
            <section class="section">
                <h2>🛠️ 기술적 분석</h2>
                <div id="technical-selector" class="technical-selector">
                    <label>분석 대상 선택:</label>
                    <select id="technical-etf-select" class="select-control"></select>
                </div>
                <div class="loading-spinner" id="technical-loading">로딩 중...</div>
                <div id="technical-signals" class="signals-container"></div>
                <div id="technical-chart" class="chart-container"></div>
            </section>

            <!-- 상세 데이터 테이블 -->
            <section class="section">
                <h2>📋 상세 성과 데이터</h2>
                <div class="loading-spinner" id="table-loading">로딩 중...</div>
                <div id="data-table" class="table-container"></div>
            </section>

            <!-- 푸터 -->
            <footer class="footer">
                <p>&copy; 2025 ETF 투자 대시보드 | 본 정보는 참고용입니다.</p>
            </footer>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
